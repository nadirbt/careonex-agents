# One command runs the pipeline: `docker compose up` (or `make run`).
# Each service is its own container with its own Dockerfile + pyproject.toml (see CLAUDE.md).
#
# AWS credentials come from the host's ~/.aws (SSO profile). Run
#   aws sso login --profile careonex-team
# on the host first. Nothing is baked into images.

x-aws-env: &aws-env
  AWS_PROFILE: ${AWS_PROFILE:-careonex-team}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  AWS_SDK_LOAD_CONFIG: "1"

services:
  data:
    build: ./services/data
    image: careonex/data:local
    environment:
      <<: *aws-env
      # Leave empty to use careonex-program-kb-<account-id>; set to reuse an existing bucket.
      CAREONEX_KB_BUCKET: ${CAREONEX_KB_BUCKET:-}
    volumes:
      # SSO token cache lives under ~/.aws/sso/cache; mounted read-write so botocore can refresh it.
      - ${HOME}/.aws:/home/app/.aws
      # Snapshot manifests land here (git-ignored).
      - ./data:/data
    command: ["ensure-buckets"]

  # The pipeline step: fetch every catalog source into the knowledge bucket.
  # Runs after `data` so the bucket exists.
  ingest:
    image: careonex/data:local
    depends_on:
      data:
        condition: service_completed_successfully
    environment:
      <<: *aws-env
      CAREONEX_KB_BUCKET: ${CAREONEX_KB_BUCKET:-}
    volumes:
      - ${HOME}/.aws:/home/app/.aws
      - ./data:/data
    command: ["ingest"]
