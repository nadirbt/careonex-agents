[project]
name = "careonex-retrieve"
version = "0.1.0"
description = "CareOneX retrieve service: question + filters -> cited passages from the Bedrock Knowledge Base"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
careonex-retrieve = "careonex_retrieve.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["careonex_retrieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
