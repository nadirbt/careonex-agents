[project]
name = "careonex-kb-sync"
version = "0.1.0"
description = "CareOneX kb-sync service: S3 Vectors index + Bedrock Knowledge Base over chunks/, run ingestion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["boto3>=1.40"]

[project.scripts]
careonex-kb = "careonex_kb.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["careonex_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
