[project]
name = "careonex-voice"
version = "0.2.0"
description = "CareOneX voice: Amazon Nova 2 Sonic bidirectional client with tool use and a mic-free smoke test"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws_sdk_bedrock_runtime>=0.1.0,<0.2.0",
    "smithy-aws-core>=0.0.1",
    "botocore>=1.34",
]

[project.optional-dependencies]
# Interactive microphone client on a laptop: `brew install portaudio && uv sync --extra mic`
mic = ["pyaudio>=0.2.13"]

[project.scripts]
careonex-voice = "nova_sonic.__main__:main"
careonex-voice-smoke = "nova_sonic.smoke:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nova_sonic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
