[project]
name = "careonex-extract"
version = "0.1.0"
description = "CareOneX extract service: raw PDF/HTML in S3 -> clean Markdown under text/"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "pymupdf4llm>=0.0.17",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "markdownify>=0.13",
]

[project.scripts]
careonex-extract = "careonex_extract.cli:main"

[dependency-groups]
dev = ["pytest>=8", "moto[s3,sts]>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["careonex_extract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
